<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记 · SylphyZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true,
        tags: 'ams'
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --ink: #1a1612;
      --paper: #f5f0e8;
      --accent: #8b6f47;
      --accent-light: #c4a882;
      --muted: #9a9080;
      --rule: #d4c9b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif SC", serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(180,160,120,0.08) 27px,
          rgba(180,160,120,0.08) 28px
        );
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 40px 120px;
    }

    .back-link {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 40px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    #loading {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    #content {
      line-height: 2;
      font-weight: 300;
      font-size: 0.95rem;
      color: #4a4035;
    }

    #content h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    #content h2 {
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--ink);
      margin-top: 48px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule);
    }

    #content h3 {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--accent);
      margin-top: 32px;
      margin-bottom: 12px;
    }

    #content h4 {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--ink);
      margin-top: 24px;
      margin-bottom: 8px;
    }

    #content p {
      margin-bottom: 16px;
    }

    #content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-light);
      transition: border-color 0.2s;
    }

    #content a:hover {
      border-color: var(--accent);
    }

    #content blockquote {
      margin: 20px 0;
      padding: 16px 24px;
      border-left: 3px solid var(--accent);
      background: rgba(255,255,255,0.4);
      color: #5a5045;
      font-size: 0.9rem;
    }

    #content blockquote p:last-child { margin-bottom: 0; }

    #content img {
      max-width: 100%;
      height: auto;
      margin: 20px 0;
      border: 1px solid var(--rule);
      border-radius: 2px;
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.4);
    }

    #content th,
    #content td {
      padding: 10px 14px;
      border: 1px solid var(--rule);
      text-align: left;
    }

    #content th {
      background: rgba(139,111,71,0.08);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    #content code {
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 0.85em;
      background: rgba(139,111,71,0.08);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--accent);
    }

    #content pre {
      margin: 20px 0;
      padding: 20px 24px;
      background: rgba(26,22,18,0.04);
      border: 1px solid var(--rule);
      overflow-x: auto;
    }

    #content pre code {
      background: none;
      padding: 0;
      color: var(--ink);
    }

    #content ul, #content ol {
      margin: 12px 0 16px 24px;
    }

    #content li {
      margin-bottom: 6px;
    }

    #content hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 48px 0;
    }

    #content strong {
      font-weight: 400;
      color: var(--ink);
    }

    #content em {
      font-style: italic;
      color: #5a5045;
    }

    mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    @media (max-width: 600px) {
      .wrap { padding: 32px 20px 80px; }
      #content table { font-size: 0.78rem; }
      #content th, #content td { padding: 6px 8px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">&larr; 返回笔记目录</a>
  <div id="loading">正在加载笔记…</div>
  <article id="content" style="display:none;"></article>
</div>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const loadingEl = document.getElementById('loading');
  const contentEl = document.getElementById('content');

  if (!file) {
    loadingEl.textContent = '未指定笔记文件';
    return;
  }

  const dir = file.substring(0, file.lastIndexOf('/') + 1);

  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(res.status);
    let md = await res.text();

    const renderer = new marked.Renderer();
    const origImage = renderer.image;
    renderer.image = function({ href, title, text }) {
      if (href && !href.startsWith('http') && !href.startsWith('/')) {
        href = dir + href;
      }
      return `<img src="${href}" alt="${text || ''}"${title ? ` title="${title}"` : ''}>`;
    };

    marked.setOptions({
      renderer: renderer,
      breaks: false,
      gfm: true
    });

    contentEl.innerHTML = marked.parse(md);
    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';

    document.title = (contentEl.querySelector('h1')?.textContent || '笔记') + ' · SylphyZ';

    if (window.MathJax && MathJax.typesetPromise) {
      await MathJax.typesetPromise([contentEl]);
    }
  } catch(e) {
    loadingEl.textContent = '加载失败：' + e.message;
  }
})();
</script>

</body>
</html>
