# Chapter 8 · Index Models 学习笔记

> 本笔记基于 *Investments* (Bodie, Kane, Marcus) 第 13 版 Chapter 8。按原书节次结构，完整覆盖全部知识点，附公式推导与图表。

---

## 一、为什么需要指数模型？——Markowitz 模型的实际困难

Markowitz 的均值-方差优化在理论上完美地解决了"给定一组资产，如何构建最优组合"的问题。但当我们尝试把它用在真实市场上时，会遇到两个严重的障碍。

### 1.1 参数爆炸

要对 $n$ 只股票做均值-方差优化，需要估计：

- $n$ 个期望收益
- $n$ 个方差
- $\dfrac{n(n-1)}{2}$ 个协方差（每一对股票之间都需要一个）

总共 $\dfrac{n(n+3)}{2}$ 个参数。当 $n = 50$ 时，需要 1,325 个估计值；当 $n = 100$ 时，近 5,150 个；如果 $n = 3000$（仍然不到 Wilshire 5000 指数的成分股数量），则超过 **450 万个**。每一个估计值都带有噪声，数量一多，累积误差便不可控。

### 1.2 协方差矩阵可能不自洽

从有限样本中分别估计每一对股票的相关系数，结果可能在数学上自相矛盾。书中给出了一个经典的三资产例子：

![不自洽的相关系数矩阵示例 (p.252)](images/p252_correlation_matrix_example.jpg)

三只资产标准差都是 20%，$\rho_{AB} = 0.9$，$\rho_{AC} = 0.9$，但 $\rho_{BC} = 0$。如果用权重 $(-1, 1, 1)$ 计算组合方差，结果是 $-200$——方差不可能为负，说明这三个相关系数不可能同时为真。但如果它们是从数据中分别估计出来的，你很难一眼看出矛盾所在。

> 注：权重 $-1$ 代表做空（short selling）。这个例子并不是说实际中会这样投资，而是用一组特殊权重来**检验**协方差矩阵是否合法（半正定）。

这两个问题促使我们去寻找一个更简洁的模型——用更少的参数、以一种必然自洽的方式来描述股票收益之间的关联结构。这就是单因子模型的出发点。

---

## 二、单因子模型——风险的分解（§8.1）

### 2.1 收益 = 期望 + 意外

任何资产的实际收益都可以写成两部分之和：

$r_i = E(r_i) + \text{unanticipated surprise} \tag{8.1}$

事前的期望收益是确定的，所有的不确定性来自"意外"部分。下一步的任务就是把这个"意外"进一步拆开。

### 2.2 系统风险 vs 公司特有风险

股市中有一个普遍现象：大部分股票倾向于同涨同跌。经济好的时候多数股票涨，经济差的时候多数股票跌。这说明股票收益的正相关性来自它们共同暴露在宏观经济因素之下——经济周期、利率、原材料价格等。

单因子模型把这个直觉形式化：

$r_i = E(r_i) + \beta_i m + e_i \tag{8.2}$

三项的含义：

- $E(r_i)$：期望收益，事前已知。
- $\beta_i m$：**系统性冲击**。$m$ 是宏观经济的意外变动（例如 GDP 增长超出预期的部分），均值为零，标准差 $\sigma_m$。$m$ 对所有股票都一样（没有下标 $i$）。$\beta_i$ 衡量股票 $i$ 对这个宏观冲击的**敏感度**——比如汽车公司的 $\beta$ 通常很大（经济好坏对它影响巨大），而制药公司的 $\beta$ 则较小。
- $e_i$：**公司特有冲击**。例如 CEO 突然辞职、新产品获批等，只影响这一家公司，均值为零。

**关键假设：**

1. $m$ 与 $e_i$ 不相关（宏观冲击与公司特有事件相互独立）
2. 不同公司的 $e_i$ 与 $e_j$ 也不相关（公司特有事件之间相互独立）

这是一个较强的假设。它意味着两家公司收益之间的**全部**关联都必须通过共同的宏观因子 $m$ 来传递。现实中同行业公司（如 BP 与 Shell）会因为油价波动而出现残差相关，违反假设 2。但正是这个假设带来了下面的巨大简化。如果残差相关确实严重，可以扩展为多因子模型（后续章节讨论）。

### 2.3 方差分解与协方差

由于 $\beta_i m$ 和 $e_i$ 不相关，总方差干净地拆为两部分：

$\sigma_i^2 = \beta_i^2 \sigma_m^2 + \sigma^2(e_i) \tag{8.3}$

- $\beta_i^2 \sigma_m^2$：**系统风险（systematic risk）**——来自宏观波动，$\beta$ 越大这部分越大。"周期型"公司（cyclical firms）$\beta$ 高，系统风险大。
- $\sigma^2(e_i)$：**公司特有风险（firm-specific risk）**——与宏观无关。

两只股票之间的协方差完全由各自对宏观因子的敏感度决定：

$\text{Cov}(r_i, r_j) = \beta_i \beta_j \sigma_m^2 \tag{8.4}$

这是一个极其重要的结果：不需要对每一对股票单独估计协方差——只要知道每只股票的 $\beta$ 以及 $\sigma_m^2$，就能算出任意两只股票的协方差。

### 2.4 期望收益-Beta 关系

对回归方程（Eq. 8.5，下一节会详述）两边取期望，因为 $E(e_i) = 0$：

$E(R_i) = \alpha_i + \beta_i E(R_M) \tag{8.6}$

这把股票 $i$ 的期望超额收益拆为两部分：

- $\beta_i E(R_M)$：**系统性风险溢价**。这是承担市场风险"应得的"补偿，$\beta$ 越高补偿越多。
- $\alpha_i$：**非市场风险溢价（alpha）**。这是超出 $\beta$ 能解释的那部分额外收益。$\alpha_i > 0$ 意味着股票被低估了，提供了额外吸引力；$\alpha_i < 0$ 意味着被高估。在市场均衡状态下，$\alpha$ 应被竞争为零。主动管理的目标就是提前找到 $\alpha \neq 0$ 的股票。

### 2.5 相关系数与参数节约

汇总所有风险和协方差的结果：

$\sigma_i^2 = \beta_i^2 \sigma_M^2 + \sigma^2(e_i)$

$\text{Cov}(r_i, r_j) = \beta_i \beta_j \sigma_M^2$

$\text{Corr}(r_i, r_j) = \frac{\beta_i \beta_j \sigma_M^2}{\sigma_i \sigma_j} = \text{Corr}(r_i, r_M) \times \text{Corr}(r_j, r_M) \tag{8.7}$

最后一行尤其优美：任意两只股票的相关系数等于它们各自与市场相关系数的**乘积**。所有的关联都通过市场这个"中介"传递。

有了这些公式，对 $n$ 只股票只需要估计 $3n + 2$ 个参数（$n$ 个 $\alpha_i$、$n$ 个 $\beta_i$、$n$ 个 $\sigma^2(e_i)$、1 个 $E(R_M)$、1 个 $\sigma_M^2$），而 Markowitz 需要 $\frac{n(n+3)}{2}$ 个。$n = 50$ 时从 1,325 降到 152；$n = 500$ 时从 125,750 降到 1,502，减少近 **99%**。

## 三、单指数模型（§8.2）

### 3.1 从抽象因子到可观测指数

Eq. 8.2 中的宏观因子 $m$ 无法直接观测——GDP 增长的"意外"部分到底是多少，没人能精确测量。但既然 $m$ 影响所有股票，一个包含大量股票的**市场指数**（如 S\&P 500）的收益率自然会反映这些宏观冲击。我们用市场指数的超额收益来**代理** $m$，得到单指数模型的回归方程：

$R_i(t) = \alpha_i + \beta_i R_M(t) + e_i(t) \tag{8.5}$

这里 $R_i = r_i - r_f$，$R_M = r_M - r_f$ 都是**超额收益**（总收益减去无风险利率 $r_f$）。使用超额收益是因为投资者把资金从 T-bill 转到股票上，只有超出无风险利率的部分才是承担风险的补偿。

需要注意：Eq. 8.5 不是从 Eq. 8.2 严格数学推导出来的。Eq. 8.2 是理论模型（$m$ 不可观测），Eq. 8.5 是它的**操作化版本**（用可观测的市场指数替代 $m$）。两者之间的桥梁是一个建模假设：市场指数能够很好地捕捉宏观冲击的效果。

### 3.2 散点图与 Security Characteristic Line

下图是 U.S. Steel 对市场指数的散点图和拟合直线（5 年月度超额收益数据）：

![Figure 8.1: U.S. Steel 散点图与 SCL (p.255)](images/p255_figure8_1_scatter_diagram.jpg)

横轴是市场指数的月度超额收益，纵轴是 U.S. Steel 的月度超额收益。每个点代表一个月的数据对。拟合出来的直线称为 **Security Characteristic Line（SCL，证券特征线）**。

- **斜率 $\beta_i$**：股票对市场的敏感度。市场每涨 1%，该股票平均涨 $\beta_i$%。$\beta > 1$ 为进攻型（aggressive/cyclical），$\beta < 1$ 为防御型（defensive）。所有股票的平均 $\beta$ 为 1，市场指数自身的 $\beta$ 定义为 1。
- **截距 $\alpha_i$**：当市场超额收益为零时，股票的期望超额收益。
- **残差 $e_i(t)$**：每个散点到回归线的垂直距离，即那个月的公司特有意外。残差越大，散点越分散。

例如图中标注的 2019 年 6 月：市场超额收益 6.93%，回归线预测 U.S. Steel 应有 13.91%，但实际为 29.75%，残差 $e = 29.75\% - 13.91\% = 15.84\%$。这说明那个月有很好的公司特有利好消息。

### 3.3 指数模型与分散化

这部分回答一个核心问题：**当你往组合里加入越来越多的股票，风险会怎么变化？**

考虑一个 $n$ 只股票的等权组合（每只权重 $w_i = 1/n$）。将 $R_i = \alpha_i + \beta_i R_M + e_i$ 代入组合收益，得到：

$R_P = \alpha_P + \beta_P R_M + e_P \tag{8.8}$

组合参数分别是各股票参数的简单平均：

$\beta_P = \frac{1}{n}\sum_{i=1}^{n}\beta_i \tag{8.10}$

$\alpha_P = \frac{1}{n}\sum_{i=1}^{n}\alpha_i \tag{8.11}$

$e_P = \frac{1}{n}\sum_{i=1}^{n}e_i \tag{8.12}$

组合方差的结构和单只股票完全一样：

$\sigma_P^2 = \beta_P^2 \sigma_M^2 + \sigma^2(e_P) \tag{8.13}$

**关键推导：公司特有风险随分散化趋于零。** 因为各 $e_i$ 相互独立（关键假设在这里起作用）：

$\sigma^2(e_P) = \sum_{i=1}^{n}\left(\frac{1}{n}\right)^2\sigma^2(e_i) = \frac{1}{n}\cdot\frac{1}{n}\sum_{i=1}^{n}\sigma^2(e_i) = \frac{1}{n}\bar{\sigma}^2(e) \tag{8.14}$

$\bar{\sigma}^2(e)$ 是所有股票公司特有方差的平均值，不依赖 $n$。当 $n \to \infty$ 时，$\sigma^2(e_P) \to 0$——公司特有风险被完全分散掉了。

而系统风险 $\beta_P^2 \sigma_M^2$ **不随 $n$ 增大而消失**，因为它取决于组合的平均 $\beta$ 和市场方差，和股票数量无关。

下图清晰地展示了这个关系：

![Figure 8.2: 分散化与组合方差 (p.260)](images/p260_figure8_2_diversification.jpg)

纵轴是组合方差 $\sigma_P^2$，横轴是股票数量 $n$。总方差随 $n$ 下降并趋近于底部的水平线 $\beta_P^2 \sigma_M^2$。上方的递减曲线与水平线之间的差距就是 $\sigma^2(e_P) = \bar{\sigma}^2(e)/n$，即可分散的部分。

结论：

- **公司特有风险 = 可分散风险（diversifiable risk）**
- **系统风险 = 不可分散风险（nondiversifiable risk）**

## 四、估计单指数模型（§8.3）

### 4.1 数据设定

使用 2017 年 1 月至 2021 年 12 月共 60 个月的数据。市场指数为 NYSE + AMEX + NASDAQ 活跃交易股票的市值加权组合，无风险资产为 T-bills。

下图展示了 U.S. Steel 和市场指数在这 60 个月中的超额收益时间序列。两条线大致同涨同跌，但 U.S. Steel 的波幅明显更大——市场月度标准差 4.66%，U.S. Steel 为 17.77%。

![Figure 8.3: U.S. Steel 与市场指数的月度超额收益 (p.261)](images/p261_figure8_3_excess_returns.jpg)

### 4.2 回归结果详解

用 Excel 的 Regression 工具对 U.S. Steel 跑回归，结果如下：

![Table 8.1: U.S. Steel 回归结果 (p.262)](images/p262_table8_1_regression.jpg)

**上半部分——整体拟合：**

- **Multiple R = 0.532**：U.S. Steel 与市场指数的相关系数，中等偏强正相关。
- **R-Square = 0.283**：市场波动只解释了 U.S. Steel 收益波动的 28.3%，剩下 71.7% 来自公司特有因素。$R^2$ 的公式正好对应风险分解：$R^2 = \frac{\beta^2\sigma_M^2}{\beta^2\sigma_M^2 + \sigma^2(e)}$，即系统风险占总风险的比例。
- **Adjusted R-Square = 0.271**：对 $R^2$ 做小幅向下修正，因为我们使用的是估计值（而非真实值）来拟合。修正公式 $R_A^2 = 1 - (1 - R^2)\frac{n-1}{n-k-1}$，这里 $n = 60$，$k = 1$，修正很小。
- **Standard Error = 15.171**：残差标准差 $\sigma(e)$（%/月），即公司特有风险的大小。年化约 $15.17\% \times \sqrt{12} \approx 52.6\%$，非常大。

**下半部分——系数估计：**

**Alpha 的估计：** 系数为 $-2.034\%$/月，看起来经济上很大。但标准误为 2.052，$t$ 统计量 $= -2.034 / 2.052 = -0.991$，绝对值远小于惯用门槛 2.0。$p$ 值 $= 0.326$，远大于 5% 的显著性水平。意思是：如果真实 $\alpha$ 为零，我们有 32.6% 的概率会观测到绝对值这么大或更大的估计值。**结论：不能拒绝 $\alpha = 0$。** 这个 $-2\%$ 很可能只是随机噪声。

**Beta 的估计：** 系数为 2.030，意味着市场每涨 1%，U.S. Steel 平均涨约 2%。$t = 4.785$，$p \approx 0$，高度显著——U.S. Steel 和市场确实有很强的关联。

更有意义的检验是 $\beta = 1$（敏感度是否显著高于市场平均）：

$t = \frac{2.030 - 1}{0.424} = 2.43 > 2$

可以拒绝，确认 U.S. Steel 是高敏感度的进攻型股票。不过 95% 置信区间为 $(1.182, 2.878)$，范围仍然很宽，精度不算理想。

**公司特有风险 vs 系统风险：** 残差标准差 15.17%/月 > 系统风险标准差 $\beta \times \sigma_M = 2.03 \times 4.66\% = 9.46\%$/月。对个股而言，公司特有风险常常大于系统风险。

### 4.3 典型回归结果：17 只股票样本

![Table 8.2: 17 家公司的指数模型回归结果 (p.264)](images/p264_table8_2_index_model_estimates.jpg)

几个要点：

- **平均 $\beta = 1.066$**，非常接近理论值 1.0。高 $\beta$：Boeing (1.474)、U.S. Steel (2.030)、Marathon Oil (2.986)——都是对经济周期敏感的行业。低 $\beta$：Campbell Soup (0.461)、Newmont Mining (0.217)、McDonald's (0.528)——防御性行业。
- **平均 $\alpha \approx 0$**。整个样本中只有两家（ExxonMobil 和 Microsoft）的 $\alpha$ 超过两倍标准误，一正一负。$\alpha$ 估计总体上统计不显著。
- **平均残差标准差 = 6.9%/月**。公司特有风险巨大，再次强调了分散化的重要性。
- **平均 $R^2 = 35\%$**。只有约三分之一的收益波动来自市场因素，三分之二来自公司特有因素。这也解释了为什么单只股票的 $R^2$ 往往不高，但充分分散的组合几乎只剩系统风险。
- 最后一列 **Adjusted Beta** 在 §8.4 详细讨论。

## 五、指数模型的行业版本（§8.4）

### 5.1 行业做法与教科书的差异

实际中，数据提供商（Yahoo Finance、Value Line 等）跑回归时与教科书有两点不同。

**差异一：市场指数的选择。** 业界通常用 S\&P 500，我们用的是更广的全市场指数。差别不大。

**差异二：用总收益而非超额收益。** 业界常用的回归是：

$r = a + b \cdot r_M + e^* \tag{8.16}$

而教科书版本是：

$r - r_f = \alpha + \beta(r_M - r_f) + e \tag{8.17}$

将 Eq. 8.17 展开：

$r = \alpha + r_f(1 - \beta) + \beta r_M + e \tag{8.18}$

对比 Eq. 8.16 和 8.18 可以看出：**斜率完全相同**（都是 $\beta$），但截距不同。业界报告的"ALPHA"实际上是 $a = \alpha + r_f(1 - \beta)$，比指数模型的 $\alpha$ 多了一项 $r_f(1 - \beta)$。月度 $r_f$ 很小（如 0.2%），所以差异通常很小。但严格来说，当 $\beta \neq 1$ 时两者不等。

此外，书中强调所有 $\alpha$ 估计都是**事后的**（ex post）。不能因为某只股票过去五年 $\alpha > 0$ 就说你事前能预测到。主动管理的核心挑战恰恰是**提前**发现 $\alpha \neq 0$ 的股票。

### 5.2 Adjusted Beta

经验事实表明，$\beta$ 随时间会**向 1 漂移**。

**直觉解释：** 一家新公司刚成立时可能很独特（技术、管理风格等）。但随着它成长壮大、业务多元化，它越来越像整体经济的平均水平，$\beta$ 自然向 1 靠拢。

**统计解释：** 所有股票的平均 $\beta$ 为 1。在估计之前，最好的先验猜测就是 1。样本中估计出的 $\beta$ 偏离 1 越远，越可能包含较大的采样误差，后续 $\beta$ 大概率会更接近 1。

调整公式很简单——把样本估计值和 1 做加权平均：

$\text{Adjusted beta} = \frac{2}{3}\hat{\beta} + \frac{1}{3}(1.0) \tag{8.19}$

例：U.S. Steel 的 $\hat{\beta} = 2.030$，adjusted beta $= \frac{2}{3}(2.030) + \frac{1}{3}(1) = 1.687$，向 1 拉了三分之一的距离。

如果预测市场收益率 8%、$r_f = 2\%$、设 $\alpha = 0$（无特殊信息），则 U.S. Steel 的预测收益率为：

$E(r_X) = r_f + \text{adjusted beta} \times [E(r_M) - r_f] = 2 + 1.687 \times 6 = 12.12\%$

### 5.3 更一般的 Beta 预测

Eq. 8.19 的 $\frac{2}{3}$、$\frac{1}{3}$ 只是一个简化规则。更一般地，可以用回归来估计 $\beta$ 的时间演化：

$\text{Current beta} = a + b \times (\text{Past beta}) \tag{8.20}$

$\text{Forecast beta} = a + b \times (\text{Current beta}) \tag{8.21}$

还可以加入更多预测变量。Rosenberg \& Guy 的研究发现以下财务变量有助于预测 $\beta$：盈利方差、现金流方差、EPS 增长率、市值、股息率、负债率。而且即使控制了这些变量，**行业本身**也有额外的预测力。

**调整因子（Adjustment Factor）** 是指：在财务变量预测的 $\beta$ 基础上，因为属于某个特定行业而需要额外加上（或减去）的修正量。例如黄金行业的调整因子为 $-0.827$（金价与市场负相关，所以金矿公司的 $\beta$ 比纯粹根据财务指标预测的要低得多），航空运输为 MARKDOWN_CONTENT0.348$（对经济极度敏感）。

![Table 8.3: 行业 Beta 与调整因子 (p.267)](images/p267_table8_3_industry_betas.jpg)

规律：调整因子为负的行业（农业、医药、公用事业、黄金）对经济不敏感；调整因子为正的行业（建筑、航空、卡车运输、耐用消费品）对经济高度敏感。

## 六、用单指数模型构建最优组合（§8.5）

这是全章最实用的部分。这里介绍的方法由 Treynor 和 Black 提出，通常称为 **Treynor-Black 模型**。

### 6.1 核心权衡

如果你完全不做证券分析，最好的选择就是被动持有市场指数。证券分析的价值在于发现 $\alpha \neq 0$ 的股票——超配被低估的（$\alpha > 0$），低配或做空被高估的（$\alpha < 0$）。但偏离指数去集中持有某些股票，就会承担额外的公司特有风险。

**核心权衡：追求 $\alpha$ 带来的超额收益 vs 偏离分散化带来的额外风险。**

### 6.2 分析框架与分工

单指数模型为投资管理提供了清晰的分工层级：

1. **宏观分析：** 估计市场风险溢价 $E(R_M)$ 和市场方差 $\sigma_M^2$。
2. **统计估计：** 回归得到每只股票的 $\beta_i$ 和 $\sigma^2(e_i)$。
3. **基准收益：** 不做证券分析时，股票 $i$ 的期望超额收益就是 $\beta_i E(R_M)$，纯粹来自市场暴露。
4. **证券分析：** 分析师的核心工作就是估计 $\alpha_i$——超出基准的那部分收益。

$\alpha$ 是区分股票好坏的关键变量。$\beta$ 不是好坏之分——$\beta$ 高意味着风险大但补偿也大，$\beta$ 低则风险小补偿也小，两者是同比例的。$\alpha > 0$ 才意味着在给定风险下你能拿到额外回报。

### 6.3 组合结构：主动 + 被动

最优组合是两块的混合：

- **主动组合 $A$**：由 $n$ 只被分析过的股票构成，利用非零 $\alpha$ 赚取超额收益。
- **被动组合 $M$**（市场指数）：$\beta_M = 1$，$\alpha_M = 0$，$\sigma^2(e_M) = 0$（无公司特有风险）。提供广泛的市场分散化。

组合参数为加权平均：

$\alpha_P = \sum_{i=1}^{n+1}w_i\alpha_i, \quad \beta_P = \sum_{i=1}^{n+1}w_i\beta_i, \quad \sigma^2(e_P) = \sum_{i=1}^{n+1}w_i^2\sigma^2(e_i) \tag{8.22}$

目标：选择权重 $w_1, \ldots, w_{n+1}$ 来最大化 Sharpe ratio $S_P = E(R_P)/\sigma_P$。

### 6.4 最优组合的求解步骤

**Step 1：主动组合内部各股票的权重。**

每只股票的初始头寸正比于它的"性价比"——$\alpha$ 越大越好，$\sigma^2(e)$ 越大越差：

$w_i^0 = \frac{\alpha_i}{\sigma^2(e_i)}$

归一化使权重加总为 1：$w_i = w_i^0 \big/ \sum w_i^0$。如果 $\alpha_i < 0$，权重为负（做空）。

**Step 2：计算主动组合的参数。**

$\alpha_A = \sum w_i\alpha_i, \quad \sigma^2(e_A) = \sum w_i^2\sigma^2(e_i), \quad \beta_A = \sum w_i\beta_i$

**Step 3：主动组合在整体中的初始权重（假设 $\beta_A = 1$）。**

$w_A^0 = \frac{\alpha_A / \sigma^2(e_A)}{E(R_M) / \sigma_M^2} \tag{8.24}$

分子 $\alpha_A/\sigma^2(e_A)$ 是主动组合的吸引力度量，分母 $E(R_M)/\sigma_M^2$ 是市场指数的同类度量。两者之比就是主动组合应占的份额。（推导见下文 §6.7。）

**Step 4：根据实际 $\beta_A$ 调整。**

$w_A^* = \frac{w_A^0}{1 + (1 - \beta_A)w_A^0} \tag{8.25}$

当 $\beta_A = 1$ 时不调整。当 $\beta_A > 1$ 时，主动组合本身已提供较多市场暴露，会挤占指数份额，$w_A^*$ 相应增大。

**Step 5：最终权重。**

$w_M^* = 1 - w_A^*, \quad w_i^* = w_A^* \times w_i$

**Step 6：组合的风险溢价和方差。**

$E(R_P) = (w_M^* + w_A^*\beta_A)E(R_M) + w_A^*\alpha_A$

$\sigma_P^2 = (w_M^* + w_A^*\beta_A)^2\sigma_M^2 + [w_A^*\sigma(e_A)]^2$

### 6.5 信息比率（Information Ratio）

最优组合的 Sharpe ratio 与指数的 Sharpe ratio 之间有一个漂亮的关系：

$S_P^2 = S_M^2 + \left[\frac{\alpha_A}{\sigma(e_A)}\right]^2 \tag{8.26}$

$\frac{\alpha_A}{\sigma(e_A)}$ 就是**信息比率（information ratio）**。它衡量主动管理的贡献：通过证券分析获得的超额收益（$\alpha_A$）相对于为此承担的公司特有风险（$\sigma(e_A)$）。信息比率越大，Sharpe ratio 提升越多。

而且主动组合的信息比率可以分解为各只股票的贡献：

$\left[\frac{\alpha_A}{\sigma(e_A)}\right]^2 = \sum_{i=1}^{n}\left[\frac{\alpha_i}{\sigma(e_i)}\right]^2 \tag{8.28}$

每只股票对组合信息比率的贡献是它自身信息比率的平方。即使 $\alpha$ 很小，只要 $\sigma(e)$ 也足够小，这只股票仍然有价值。

**重要推论：** 如果所有 $\alpha_i = 0$，信息比率为零，$w_A^* = 0$，最优组合就是指数本身。只有证券分析能发现非零 $\alpha$ 时，偏离指数才有意义。

### 6.6 数值例子

书中用六只股票（Walmart、Target、Verizon、AT\&T、Ford、GM）加市场指数演示了完整流程：

![Spreadsheet 8.1: 指数模型完整计算示例 (p.274)](images/p274_spreadsheet8_1.jpg)

- **Panel A**：风险参数。公司特有风险普遍很大。
- **Panel B**：残差相关矩阵。同行业股票的残差相关性很高（Ford 与 GM 达 0.699），违反指数模型假设。作者故意这样选来测试模型的稳健性。
- **Panel C**：指数模型协方差矩阵（用 $\beta_i\beta_j\sigma_M^2$ 计算）。
- **Panel D**：$\alpha$ 预测值，都很小（实际中需大幅缩减以反映预测误差）。
- **Panel E**：最优组合计算。主动组合内部权重激进（如 Walmart 0.685），$\alpha_A = 2.42\%$。但残差方差也大（$\sigma^2(e_A) = 0.0303$），所以主动组合在整体中被压缩到只有 $w_A^* = 0.1809$。最终 Sharpe ratio = 0.5165，纯指数为 0.4975。改善不大，反映了 $\alpha$ 预测值本身很小。

### 指数模型 vs Markowitz 模型的对比

![Figure 8.4 与 Table 8.4: 两种方法的对比 (p.276)](images/p276_figure8_4_table8_4.jpg)

Figure 8.4 画了两种方法的有效前沿。指数模型看起来更好，但那只是因为它假设残差不相关从而高估了分散化效果。在标准差 10% 以上的区域，两条线非常接近。

Table 8.4 对比了最优组合。Markowitz 模型利用了残差相关信息（如 Walmart 正 $\alpha$、Target 负 $\alpha$、两者残差正相关，所以更激进地做多 Walmart、做空 Target）。但最终 Sharpe ratio 几乎一样：**0.5165 vs 0.5163**。

**结论：** 理论上 Markowitz 更灵活，但大量协方差的估计误差可能让实际效果反而更差。指数模型参数少、估计稳定、便于分工，实践中表现出人意料地好。

### 6.7 附录：Eq. 8.24 和 8.26 的推导

书中跳过了推导步骤，这里补上。

**推导 Eq. 8.24**

假设 $\beta_A = 1$。混合主动组合 $A$（权重 $w_A$）与市场指数 $M$（权重 $1 - w_A$）。由于 $\beta_A = 1$，$R_A = \alpha_A + R_M + e_A$，代入组合收益：

$R_P = w_A(\alpha_A + R_M + e_A) + (1 - w_A)R_M = w_A\alpha_A + R_M + w_Ae_A$

因此：

$E(R_P) = w_A\alpha_A + E(R_M)$

$\sigma_P^2 = \sigma_M^2 + w_A^2\sigma^2(e_A)$

（$R_M$ 与 $e_A$ 不相关，$R_M$ 前面系数为 1 不含 $w_A$。）

最大化 Sharpe ratio 的平方：

$S_P^2 = \frac{[w_A\alpha_A + E(R_M)]^2}{\sigma_M^2 + w_A^2\sigma^2(e_A)}$

对 $w_A$ 求导，令 $\frac{d(S_P^2)}{dw_A} = 0$。用商的求导法则 $N'D = ND'$：

$\alpha_A[\sigma_M^2 + w_A^2\sigma^2(e_A)] = [w_A\alpha_A + E(R_M)] \cdot w_A\sigma^2(e_A)$

展开并消去 $w_A^2\alpha_A\sigma^2(e_A)$ 项：

$\alpha_A\sigma_M^2 = w_AE(R_M)\sigma^2(e_A)$

解得：

$\boxed{w_A^0 = \frac{\alpha_A/\sigma^2(e_A)}{E(R_M)/\sigma_M^2}}$

**推导 Eq. 8.26**

将 $w_A^0 = \frac{\alpha_A\sigma_M^2}{E(R_M)\sigma^2(e_A)}$ 代回 $S_P^2$ 的表达式。经过代数化简（设 $N = w_A^0\alpha_A + E(R_M)$，$D = \sigma_M^2 + (w_A^0)^2\sigma^2(e_A)$，代入并逐步约分）：

$S_P^2 = \frac{\alpha_A^2\sigma_M^2 + E(R_M)^2\sigma^2(e_A)}{\sigma_M^2\sigma^2(e_A)}$

拆开两项：

$S_P^2 = \frac{E(R_M)^2}{\sigma_M^2} + \frac{\alpha_A^2}{\sigma^2(e_A)}$

$\boxed{S_P^2 = S_M^2 + \left[\frac{\alpha_A}{\sigma(e_A)}\right]^2}$

**直觉总结：**

- Eq. 8.24 说的是：主动组合的最优权重取决于它的"性价比"（$\alpha_A/\sigma^2(e_A)$）与市场指数"性价比"（$E(R_M)/\sigma_M^2$）之比。
- Eq. 8.26 说的是：最优组合的 Sharpe ratio 平方 = 市场 Sharpe ratio 平方 + 信息比率平方。主动管理的价值完全体现在信息比率上，以平方和的方式叠加。

## 七、全章要点回顾

1. **单因子模型**把不确定性分解为系统性（宏观）和公司特有（微观）两个来源。用市场指数代理宏观因子，就得到**单指数模型**。
2. 单指数模型将所需参数从 $O(n^2)$ 降到 $3n+2$，并使宏观分析和证券分析能够**分工进行**。
3. 系统风险为 $\beta^2\sigma_M^2$，任意两只股票的协方差为 $\beta_i\beta_j\sigma_M^2$。
4. 回归估计中，斜率是 $\beta$，截距是 $\alpha$，拟合直线称为 **SCL**。
5. 业界用总收益回归时，截距 $= \alpha + r_f(1-\beta)$，与教科书的 $\alpha$ 略有不同。
6. $\beta$ 有向 1 回归的经验趋势。Adjusted beta $= \frac{2}{3}\hat{\beta} + \frac{1}{3}$。可用财务变量和行业因子进一步改进预测。
7. 最优主动组合中各股票权重正比于 $\alpha_i/\sigma^2(e_i)$。**信息比率** $\alpha_A/\sigma(e_A)$ 决定了主动管理对 Sharpe ratio 的贡献。
